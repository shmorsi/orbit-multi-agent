name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The suite is the scripted harness. Torch and the Colab pins are not required here.
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests mission/build_board.py
      - name: Browser
        if: matrix.python-version == '3.12'
        run: python -m playwright install --with-deps chromium
      - name: Leakage check
        run: python finetune/leakage.py
      - name: Doctor
        run: python -m orbit_agents.doctor
      - name: Tests
        env:
          REQUIRE_EVAL_TAG: "1"
          ORBIT_BROWSER: ${{ matrix.python-version == '3.12' && '1' || '0' }}
        run: python -m pytest
