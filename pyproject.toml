[project]
name = "orbit-agents"
version = "0.1.0"
description = "Orbit: a multi-agent team where every turn is a schema-checked JSON object, the reviewer is code, and a patch ships only when the tests pass. Frozen evals, JSONL traces, and a QLoRA track."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sherif Morsi", email = "shmorsi@outlook.com" }]
dependencies = ["jsonschema>=4.21"]

[project.urls]
Homepage = "https://shmorsi.github.io/orbit/"
Repository = "https://github.com/shmorsi/orbit-multi-agent"
Author = "https://shmorsi.github.io/"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.2", "playwright==1.64.1", "fonttools==4.67.0", "brotli==1.2.1"]
infer = [
  "torch==2.11.0",
  "transformers==5.20.2",
  "tokenizers==0.23.3",
  "huggingface-hub==1.33.0",
  "peft==0.21.2",
  "accelerate==1.15.0",
]
finetune = [
  "transformers==5.20.2",
  "tokenizers==0.23.3",
  "huggingface-hub==1.33.0",
  "accelerate==1.15.0",
  "peft==0.21.2",
  "bitsandbytes==0.50.2",
  "trl==1.16.0",
  "matplotlib==3.10.0",
]

[project.scripts]
orbit = "orbit_agents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "finetune"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["F", "E", "I", "B", "UP"]
ignore = ["E501"]
